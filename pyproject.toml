[project]
name = "chorva-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.4",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pillow>=11.1",
    "requests>=2.32",
    "sentry-sdk>=2.19",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "django-cors-headers>=4.9.0",
    "djangorestframework-stubs>=3.18.1",
    "django-redis>=5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "root.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 120
exclude = ['__init__.py']

[tool.ruff.lint]
ignore = ["RUF012"]

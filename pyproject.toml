[project]
name = "chorva-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.4",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pillow>=11.1",
    "requests>=2.32",
    "sentry-sdk>=2.19",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
]
